name: Build TWRP 12.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git-core gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip python3 rsync openjdk-11-jdk repo

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize TWRP Source
        run: |
          mkdir twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j$(nproc)

      - name: Clone Device Tree
        run: |
          cd twrp
          git clone --depth=1 \
            https://github.com/Shas45558/S_a13_twrp.git \
            -b main \
            device/xiaomi/lancelot

      - name: Build Recovery
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_lancelot-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-lancelot
          path: |
            twrp/out/target/product/lancelot/*.img
      
